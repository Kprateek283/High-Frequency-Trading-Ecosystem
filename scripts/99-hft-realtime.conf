# PAM limits for running the HFT exchange with realtime scheduling.
#
#   sudo cp scripts/99-hft-realtime.conf /etc/security/limits.d/
#   # then log out and back in (PAM applies limits at login), and check:
#   ulimit -r        # expect 80, not 0
#
# Why this is needed: exchange.cpp and tcp_server.h call pthread_setschedparam()
# with SCHED_FIFO. With RLIMIT_RTPRIO at 0 -- the Fedora default -- that call
# returns EPERM and every hot-path thread silently runs SCHED_OTHER. The exchange
# now prints "RT_SCHED: granted=N/M priority=P" on stdout so a run cannot claim
# realtime scheduling it did not get.
#
# rtprio 80 matches the RT_PRIORITY default in hft_engine/src/core/realtime.h.
# It is deliberately NOT 99: priority 99 shares a band with kernel migration and
# watchdog threads, and starving those is how a "fast" configuration becomes an
# unresponsive machine. For reference, PipeWire on this box uses 70
# (/etc/security/limits.d/25-pw-rlimits.conf).
#
# memlock covers mlockall(MCL_CURRENT | MCL_FUTURE) in set_realtime_priority().
#
# Replace `prateek` with the account that runs the benchmark, or switch to a
# group (e.g. `@realtime`) if more than one user needs it.

prateek  -  rtprio   80
prateek  -  memlock  unlimited
